<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sconote</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
      }
      #note {
        font-size: 7rem;
        font-weight: 700;
        min-height: 1.2em;
        line-height: 1.2;
      }
      #note.in-tune {
        color: #4ade80;
      }
      #meter {
        position: relative;
        width: 320px;
        height: 8px;
        border-radius: 4px;
        background: #333;
      }
      #meter::after {
        content: "";
        position: absolute;
        left: 50%;
        top: -4px;
        width: 2px;
        height: 16px;
        background: #666;
      }
      #needle {
        position: absolute;
        top: -6px;
        left: 50%;
        width: 4px;
        height: 20px;
        border-radius: 2px;
        background: #f87171;
        transition: left 80ms linear;
      }
      #details {
        color: #888;
        font-variant-numeric: tabular-nums;
        min-height: 1.2em;
      }
      #transcription {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      /* The display:flex above would defeat the hidden attribute. */
      #transcription[hidden] {
        display: none;
      }
      #roll {
        background: #1a1a1a;
        border-radius: 8px;
        max-width: 90vw;
      }
      #score {
        background: #f7f4ea;
        border-radius: 8px;
        padding: 0.5rem 0;
        /* Verovio pages are width-100% SVGs, so the container needs a
           definite width (this is a centered flex item that starts empty). */
        width: min(720px, 90vw);
        max-height: 45vh;
        overflow: auto;
      }
      #transcription-summary {
        color: #888;
        font-size: 0.9rem;
      }
      #transcription button {
        font-size: 0.9rem;
        padding: 0.3rem 0.9rem;
        margin: 0 0.25rem;
        background: #333;
        color: #ccc;
      }
      button {
        font-size: 1.1rem;
        padding: 0.6rem 1.6rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="note">–</div>
    <div id="meter"><div id="needle"></div></div>
    <div id="details"></div>
    <button id="start">Start listening</button>
    <button id="upload">Upload audio…</button>
    <input type="file" id="upload-input" accept="audio/*,.wav" hidden />
    <button id="record" hidden>● Record session</button>
    <button id="transcribe" hidden>Transcribe recording</button>
    <div id="transcription" hidden>
      <div>
        <button id="download-wav">Download WAV</button>
        <button id="download-notes">Download JSON</button>
        <button id="download-midi">Download MIDI</button>
        <button id="download-musicxml">Download MusicXML</button>
        <button id="download-pdf" hidden>Download PDF</button>
      </div>
      <canvas id="roll" width="720" height="240"></canvas>
      <div id="score" hidden></div>
      <div id="transcription-summary"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
