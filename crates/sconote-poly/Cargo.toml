[package]
name = "sconote-poly"
version.workspace = true
edition.workspace = true

[dependencies]
hound = "3.5"
# No default features: "parallel" pulls rayon, which panics on wasm32
# (no threads) - and this crate must stay WASM-clean.
midly = { version = "0.5", default-features = false, features = ["alloc", "std"] }
# MP3 only - every other container/codec stays out of the wasm binary.
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
thiserror = "2"
tract-onnx = "0.21"
# Optional, native only: rayon panics on wasm32 (no threads), so the wasm
# crate must never enable `parallel`; the ffi crate does.
rayon = { version = "1", optional = true }

[features]
# Run transcription windows across all cores (compute_activations).
parallel = ["dep:rayon"]

[dev-dependencies]
sconote-core = { path = "../sconote-core" }
